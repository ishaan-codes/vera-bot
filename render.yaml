services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    buildCommand: "echo no dependencies"
    startCommand: "python server.py"
    healthCheckPath: /v1/healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false          # set the value in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash,gemini-flash-latest,gemini-2.0-flash"
      - key: LLM_RPM
        value: "12"          # free-tier safe; set 200+ if billing is enabled on the Gemini key
      - key: TICK_BUDGET_SECONDS
        value: "11"
      - key: ACCESS_LOG
        value: "1"
